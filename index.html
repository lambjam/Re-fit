<body>

    <div class="meadow" aria-hidden="true">
      <svg class="floor-planks" viewBox="0 0 1000 300" preserveAspectRatio="none">

          <rect x="4" y="19" width="202" height="23" rx="11" fill="#b5c0a5"/>

          <rect x="92" y="166" width="6" height="22" rx="3" fill="#806951"/>
          <rect x="112" y="166" width="6" height="22" rx="3" fill="#806951"/>
          <rect x="14" y="266" width="182" height="17" rx="7" fill="#8c9a7d"/>

        </g>

        <defs>

        <g clip-path="url(#basket-body-clip)" fill="none" stroke="#c8b391" stroke-width="3" opacity=".55">
          <path d="M42 98h116M40 119h118M38 140h118M36 161h118M34 182h118M54 82l-9 122M79 78l-7 128M105 76l-4 132M131 76l2 132M155 78l8 125"/>
        </g>
        <ellipse cx="100" cy="82" rx="77" ry="14" fill="#f0e2c9"/>

        <path d="M24 82Q100 110 176 82" fill="none" stroke="#f1e4ce" stroke-width="7" stroke-linecap="round"/>

    </div>

    <div class="scene" aria-label="Doggo pops out of a colorful pile of clothes">
      <svg class="illustration" viewBox="0 0 1000 560" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">Doggo and the Re-Fit clothes pile</title>
        <desc id="scene-desc">A sweet taupe puppy with pink ears and a green sprout pops up from a pile of cream, sage, dusty rose, lavender, and striped clothes.</desc>
        <defs>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1a2c25" flood-opacity=".2"/></filter>
          <pattern id="knit" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f1e7d6"/><path d="M4 1c7 4-7 10 0 14M12 1c-7 4 7 10 0 14" fill="none" stroke="#dfd2bf" stroke-width="2"/></pattern>
          <pattern id="stripes" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#eee5d6"/><path d="M0 5h20M0 15h20" stroke="#81746b" stroke-width="4"/></pattern>
          <pattern id="rose-dots" width="28" height="26" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.4" fill="#f1c9c2"/><circle cx="21" cy="20" r="2.4" fill="#f1c9c2"/></pattern>
          <pattern id="sage-knit" width="22" height="22" patternUnits="userSpaceOnUse">
            <rect width="22" height="22" fill="#a8b69a"/>
            <path d="M6-2c-5 4 5 8 0 12s5 8 0 12M16-2c-5 4 5 8 0 12s5 8 0 12" fill="none" stroke="#d3dac8" stroke-width="2.2" opacity=".78"/>
          </pattern>
          <linearGradient id="fabric-sage" x2=".2" y2="1"><stop stop-color="#c0c7ae"/><stop offset=".48" stop-color="#a8b69a"/><stop offset="1" stop-color="#77886b"/></linearGradient>
          <linearGradient id="fabric-rose" x2=".15" y2="1"><stop stop-color="#d6a0a2"/><stop offset=".55" stop-color="#bd858c"/><stop offset="1" stop-color="#9f6976"/></linearGradient>
          <linearGradient id="fabric-lavender" x2=".15" y2="1"><stop stop-color="#c3bac8"/><stop offset=".55" stop-color="#a8a0ae"/><stop offset="1" stop-color="#88808f"/></linearGradient>
          <linearGradient id="fabric-oat" x2=".15" y2="1"><stop stop-color="#e8dcc8"/><stop offset=".6" stop-color="#d3c5b0"/><stop offset="1" stop-color="#b5a58f"/></linearGradient>
          <linearGradient id="fabric-moss" x2=".2" y2="1"><stop stop-color="#8c9b7b"/><stop offset=".55" stop-color="#718367"/><stop offset="1" stop-color="#53664d"/></linearGradient>
          <linearGradient id="fabric-cream" x2=".1" y2="1"><stop stop-color="#fff4e2"/><stop offset=".6" stop-color="#f1e7d6"/><stop offset="1" stop-color="#d8cbb7"/></linearGradient>
          <linearGradient id="fabric-pink" x2=".15" y2="1"><stop stop-color="#e3b8b1"/><stop offset=".6" stop-color="#d2a6a4"/><stop offset="1" stop-color="#b98485"/></linearGradient>
        </defs>

        <!-- Soft dusty-rose rug beneath the clothing pile -->
        <ellipse cx="500" cy="480" rx="473" ry="61" fill="#d2a6a4"/>
        <ellipse cx="500" cy="480" rx="452" ry="46" fill="#e6d3b7"/>
        <!-- Back folds of the clothes pile -->
        <g class="back-clothes" filter="url(#softShadow)">
          <path d="M118 435c-3-61 66-113 153-119 73-5 106 33 100 91-6 57-69 84-154 76-62-6-96-16-99-48Z" fill="url(#sage-knit)"/>
          <path d="M239 390c11-62 82-103 159-95 63 7 98 48 79 96-20 49-95 69-167 54-51-10-78-27-71-55Z" fill="#bd858c"/>
          <path d="M422 367c-3-55 62-95 137-91 66 4 104 41 91 84-13 47-80 69-153 60-47-6-73-21-75-53Z" fill="#a8a0ae"/>
          <path d="M579 390c-3-57 59-98 133-94 66 3 104 39 94 82-11 50-74 73-147 64-50-7-78-21-80-52Z" fill="#d3c5b0"/>
          <path d="M336 337c-9-52 39-94 100-98 63-5 104 26 101 66-4 48-53 72-119 70-49-2-77-12-82-38Z" fill="#718367"/>
          <!-- Pink blob fills the gap above the beige piece, overlapping purple and beige beneath the cream knit. -->
          <g transform="translate(652 292) scale(1.14) translate(-652 -292)">
            <path d="M576 294c4-26 38-44 82-42 45 2 75 24 69 48-6 25-50 39-99 31-34-5-55-20-52-37Z" fill="#ba818c"/>
            <path d="M576 294c4-26 38-44 82-42 45 2 75 24 69 48-6 25-50 39-99 31-34-5-55-20-52-37Z" fill="url(#rose-dots)" opacity=".8"/>
          </g>
          <path d="M366 267c4-53 51-97 119-99 73-2 121 35 109 78-12 43-73 59-141 54-53-4-90-12-87-33Z" fill="url(#knit)"/>
        </g>
        <!-- Animated vector Doggo: rounded triangle ears, a little sprout, and a bouncy body. -->
        <g transform="translate(0 -38)">
        <g class="doggo" id="doggo" filter="url(#softShadow)">
          <!-- tail sits behind the body and wags -->
          <circle class="tail" cx="635" cy="397" r="43" fill="#B29D93" stroke="#98837A" stroke-width="13"/>
          <!-- seated body -->
          <ellipse cx="501" cy="424" rx="120" ry="111" fill="#AB978D"/>
          <ellipse cx="502" cy="429" rx="77" ry="99" fill="#B29D93" opacity=".42"/>
          <!-- head -->
          <ellipse cx="500" cy="300" rx="160" ry="132" fill="#B29D93"/>
          <!-- ears overlap the head on top, so their roots stay visibly attached -->
          <path d="M377 250 Q370 258 366 245 L340 155 Q336 140 351 144 L466 174 Q483 179 472 192Z" fill="#98837A"/>
          <path d="M387 222 Q383 228 381 220 L369 177 Q367 169 376 171 L440 186 Q450 189 442 196Z" fill="#BD739B"/>
          <path d="M623 250 Q630 258 634 245 L660 155 Q664 140 649 144 L534 174 Q517 179 528 192Z" fill="#98837A"/>
          <path d="M613 222 Q617 228 619 220 L631 177 Q633 169 624 171 L560 186 Q550 189 558 196Z" fill="#BD739B"/>
          <!-- eyes are set wider apart -->
          <g class="eye-blink">
            <circle cx="420" cy="292" r="32" fill="#9F8C82" opacity=".72"/>
            <circle cx="580" cy="292" r="32" fill="#9F8C82" opacity=".72"/>
            <circle cx="420" cy="292" r="24" fill="#FFFDF8"/>
            <circle cx="580" cy="292" r="24" fill="#FFFDF8"/>
            <circle cx="426" cy="295" r="14" fill="#171513"/><circle cx="574" cy="295" r="14" fill="#171513"/>
            <circle cx="431" cy="289" r="5" fill="#fff"/><circle cx="579" cy="289" r="5" fill="#fff"/>
          </g>
          <!-- muzzle and friendly nose -->
          <ellipse cx="500" cy="337" rx="50" ry="45" fill="#9F8C82"/>
          <ellipse cx="500" cy="326" rx="29" ry="22" fill="#332D2A"/>
          <path d="M500 346v12m0 0q-7 14-17 2m17-2q7 14 17 2" fill="none" stroke="#332D2A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- leafy sprout -->
          <g class="sprout" fill="#405B43">
            <path d="M500 174q-4-48 2-82" fill="none" stroke="#332D2A" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="486" cy="158" rx="10" ry="19" transform="rotate(-58 486 158)"/>
            <ellipse cx="514" cy="143" rx="10" ry="19" transform="rotate(58 514 143)"/>
            <ellipse cx="486" cy="94" rx="9" ry="17" transform="rotate(-50 486 94)"/>
            <ellipse cx="514" cy="94" rx="9" ry="17" transform="rotate(50 514 94)"/>
          </g>
        </g>
        </g>

        <!-- Front garments hide Doggo's lower body, making the pop feel real -->
        <g class="front-clothes" filter="url(#softShadow)">
          <path d="M147 421c44-44 139-58 207-37 49 15 69 54 42 82-36 39-152 49-231 28-57-15-62-42-18-73Z" fill="#d2a6a4"/>
          <path d="M223 456c26-48 113-66 177-44 58 19 70 62 24 83-55 25-162 24-199-7-13-11-14-21-2-32Z" fill="url(#stripes)"/>
          <path d="M565 416c33-42 116-56 174-34 56 21 61 61 14 84-54 26-147 23-183-5-17-13-19-29-5-45Z" fill="#7e906f"/>
          <path d="M620 458c32-48 123-58 184-31 44 20 49 53 8 72-51 24-143 17-184-8-16-10-19-21-8-33Z" fill="#ba818c"/>
          <path d="M620 458c32-48 123-58 184-31 44 20 49 53 8 72-51 24-143 17-184-8-16-10-19-21-8-33Z" fill="url(#rose-dots)" opacity=".8"/>
          <path d="M373 460c21-47 92-66 153-47 52 17 66 55 29 77-45 27-133 27-174 3-19-11-21-21-8-33Z" fill="#e9decf"/>
          <path d="M394 464c37-13 95-16 143-4m-158 20c42-12 101-12 151 0" fill="none" stroke="#c8b9a7" stroke-width="5" stroke-linecap="round"/>
          <!-- paws resting over the clothes -->
          <g class="paws">
            <circle cx="420" cy="411" r="34" fill="#98837A"/><circle cx="420" cy="411" r="24" fill="#B29D93"/>
            <circle cx="580" cy="409" r="34" fill="#98837A"/><circle cx="580" cy="409" r="24" fill="#B29D93"/>
          </g>
        </g>
      </svg>
    </div>
